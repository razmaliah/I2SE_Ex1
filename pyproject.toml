[project]
name = "plane-projection"
version = "0.1.0"
description = "Plane projection of a 3D NRRD volume (I2SE Ex1)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # pynrrd's writer (used only by the tests to create NRRD files) calls a deprecated
    # datetime function; this is in the library, not in our code.
    "ignore:datetime.datetime.utcnow:DeprecationWarning:nrrd.writer",
]
